name: Resolve Équilibre source images

on:
  workflow_dispatch:
  push:
    paths:
      - tools/resolve_recipe_images.py
      - .github/workflows/resolve_recipe_images.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve source images
        run: |
          python3 -m pip install --disable-pip-version-check requests beautifulsoup4
          python3 tools/resolve_recipe_images.py

      - name: Publish image map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/recipe_image_map.json
          git commit -m "Resolve source images for 8043 Équilibre recipes" || exit 0
          git push

# Trigger full 8043 image resolution after POC validation
