name: Export Ciqual 2025

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Ciqual 2025 XLSX
        run: |
          curl -L --fail --retry 3 -o /tmp/ciqual.xlsx 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/RPWYZD'
          test "$(md5sum /tmp/ciqual.xlsx | cut -d' ' -f1)" = '0d9758ce23f3f13dd63a005bc1bb4f2c'
      - name: Convert to compact CSV
        run: |
          python -m pip install --quiet pandas openpyxl
          python - <<'PY'
          import pandas as pd
          import re
          src='/tmp/ciqual.xlsx'
          df=pd.read_excel(src, sheet_name='composition nutritionnelle', dtype=str)
          def norm(s):
              return re.sub(r'[^a-z0-9]+', '', str(s).lower().replace('é','e').replace('è','e').replace('ê','e').replace('à','a').replace('û','u').replace('î','i').replace('ô','o').replace('ç','c').replace('µ','u'))
          wanted={
              'alim_code':'alim_code',
              'alim_nom_fr':'alim_nom_fr',
              'energie_reglement_ue_n1169_2011_kcal_100_g':'energie_kcal_100g',
              'proteines_n_x_facteur_de_jones_g_100_g':'proteines_g_100g',
              'glucides_g_100_g':'glucides_g_100g',
              'lipides_g_100_g':'lipides_g_100g',
              'fibres_alimentaires_g_100_g':'fibres_g_100g',
          }
          normalized={norm(c):c for c in df.columns}
          def find(prefix):
              for k,c in normalized.items():
                  if k==prefix or k.startswith(prefix) or prefix in k:
                      return c
              raise KeyError(prefix)
          cols={find(k):v for k,v in wanted.items()}
          out=df[list(cols)].rename(columns=cols)
          out.to_csv('data/ciqual_2025_equilibre.csv', index=False)
          assert len(out)==3484, len(out)
          PY
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ciqual_2025_equilibre.csv
          git diff --cached --quiet && exit 0
          git commit -m 'chore: add Ciqual 2025 nutrition dataset'
          git push