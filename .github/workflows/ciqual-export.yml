name: Export Ciqual 2025

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Ciqual 2025 XLSX
        run: |
          curl -L --fail --retry 3 -o /tmp/ciqual.xlsx 'https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/RPWYZD'
          test "$(md5sum /tmp/ciqual.xlsx | cut -d' ' -f1)" = '0d9758ce23f3f13dd63a005bc1bb4f2c'
      - name: Convert to compact CSV
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import csv, re
          from openpyxl import load_workbook
          src='/tmp/ciqual.xlsx'
          wb=load_workbook(src, read_only=True, data_only=True)
          ws=wb['composition nutritionnelle']
          rows=ws.iter_rows(values_only=True)
          headers=next(rows)
          def norm(s):
              return re.sub(r'[^a-z0-9]+','',str(s).lower().replace('é','e').replace('è','e').replace('ê','e').replace('à','a').replace('û','u').replace('î','i').replace('ô','o').replace('ç','c').replace('µ','u'))
          wanted={
              'alim_code':'alim_code',
              'alim_nom_fr':'alim_nom_fr',
              'energie_reglement_ue_n11692011_kcal100g':'energie_kcal_100g',
              'proteinesnxfacteurdejonesg100g':'proteines_g_100g',
              'glucidesg100g':'glucides_g_100g',
              'lipidesg100g':'lipides_g_100g',
              'fibresalimentairesg100g':'fibres_g_100g',
          }
          normalized={norm(c):i for i,c in enumerate(headers)}
          def find(prefix):
              if prefix in normalized: return normalized[prefix]
              for k,i in normalized.items():
                  if k.startswith(prefix) or prefix in k: return i
              raise KeyError(prefix)
          idx={out:find(key) for key,out in wanted.items()}
          with open('data/ciqual_2025_equilibre.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f)
              w.writerow(list(wanted.values()))
              count=0
              for row in rows:
                  if not row or row[idx['alim_code']] is None: continue
                  w.writerow([row[idx[out]] for out in wanted.values()])
                  count += 1
          assert count==3484, count
          wb.close()
          PY
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ciqual_2025_equilibre.csv
          git diff --cached --quiet && exit 0
          git commit -m 'chore: add Ciqual 2025 nutrition dataset'
          git push